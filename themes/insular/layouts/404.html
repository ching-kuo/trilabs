{{ define "main" }}

  <h1>{{ i18n "notFoundTitle" | default "頁面不存在" }}</h1>
  <p>{{ i18n "notFoundBody" | default "你尋找的頁面可能已經被搬走或刪除了。" }}</p>

{{ end }}

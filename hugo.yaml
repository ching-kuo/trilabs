baseURL: "https://trilabs.dev/"
languageCode: "en"
title: "Tri Labs"
theme: "insular"

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
hasCJKLanguage: true

permalinks:
  post: "/:year/:slug/"

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML

paginate: 9

languages:
  en:
    contentDir: content/en
    languageName: "English"
    languageCode: "en"
    weight: 1
    title: "Tri Labs"
    params:
      description: "Triathlete. Cloud engineer. Engineering the perfect race."
      tagline: "A NOTEBOOK ON ENDURANCE"
    menu:
      main:
        - identifier: posts
          name: Posts
          url: /post/
          weight: 1
        - identifier: gear
          name: Gear
          url: /page/gear/
          weight: 2
        - identifier: races
          name: Races
          url: /page/races/
          weight: 3
        - identifier: about
          name: About
          url: /page/about/
          weight: 4
        - identifier: search
          name: Search
          url: /page/search/
          weight: 5

  zh-tw:
    contentDir: content/zh-tw
    languageName: "繁體中文"
    languageCode: "zh-Hant-TW"
    weight: 2
    title: "Tri Labs | 數據與耐力"
    params:
      description: "用工程思維，把跑進 Sub-10 的 226 超鐵當成系統問題在解。裝備、訓練、賽事筆記。"
      tagline: "A NOTEBOOK ON ENDURANCE"
    menu:
      main:
        - identifier: posts
          name: 文章
          url: /zh-tw/post/
          weight: 1
        - identifier: gear
          name: 裝備
          url: /zh-tw/page/gear/
          weight: 2
        - identifier: races
          name: 賽事
          url: /zh-tw/page/races/
          weight: 3
        - identifier: about
          name: 關於
          url: /zh-tw/page/about/
          weight: 4
        - identifier: search
          name: 搜尋
          url: /zh-tw/page/search/
          weight: 5

  ja:
    contentDir: content/ja
    languageName: "日本語"
    languageCode: "ja"
    weight: 3
    title: "Tri Labs | データと耐久力"
    params:
      description: "トライアスリート。クラウドエンジニア。完璧なレースを設計する。"
      tagline: "A NOTEBOOK ON ENDURANCE"
    menu:
      main:
        - identifier: posts
          name: 記事
          url: /ja/post/
          weight: 1
        - identifier: gear
          name: ギア
          url: /ja/page/gear/
          weight: 2
        - identifier: races
          name: レース
          url: /ja/page/races/
          weight: 3
        - identifier: about
          name: About
          url: /ja/page/about/
          weight: 4
        - identifier: search
          name: 検索
          url: /ja/page/search/
          weight: 5

params:
  author: "Ching Kuo"
  mainSections:
    - post

  footer:
    since: 2026
    customText: "hi [at] trilabs.dev"

  social:
    github: "https://github.com/igene"

  dateFormat:
    published: "Jan 02, 2006"
    lastUpdated: "Jan 02, 2006 15:04 MST"

  article:
    toc: true
    readingTime: true

  opengraph:
    twitter:
      card: summary_large_image

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 80
    - name: categories
      weight: 60

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4

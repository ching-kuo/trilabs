hrc_note_swim1:
  other: "Neither sensor is gold standard in water — both wrist optical. High-intensity main set (15:25–32:40): MAE 1.3 bpm."
hrc_note_swim2:
  other: "Workout: 200m warmup → 3×500m @90% → 12×25m max stroke rate → 200m cooldown. Warmup MAE 17.5 bpm. Main sets MAE 1.6 bpm. Peak: 180 vs 181 bpm."
hrc_note_bike:
  other: "Garmin HRM chest strap is the reference standard. 11 stationary segments (~26min rest stop) removed via speed < 0.5 m/s from FIT file."
hrc_note_longrun:
  other: "Fitbit auto-detected. TCX exports HR at ~2min intervals (55 pts over 109min). First ~90s is alignment artifact. Peak delta: 5 bpm."
hrc_note_intervalrun:
  other: "Peak HR matched at 182 bpm. ~60s lag at ~20min when starting a new interval after recovery — Fitbit optical slow to ramp up."
hrc_note_indoor:
  other: "HRM-Pro chest strap → greenTEG CORE sensor → Zwift FIT export. Fitbit covers full session; Garmin Fenix 8 watch optical started ~39min in. MAE vs HRM strap gold standard."

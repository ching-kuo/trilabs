hrc_note_swim1:
  other: "水中ではどちらのセンサーも基準にはならない——両方とも手首光学式。高強度メインセット（15:25–32:40）：MAE 1.3 bpm。"
hrc_note_swim2:
  other: "練習：200m ウォームアップ → 3×500m @90% → 12×25m 最大ストローク頻度 → 200m クールダウン。ウォームアップ MAE 17.5 bpm。メインセット MAE 1.6 bpm。ピーク：180 vs 181 bpm。"
hrc_note_bike:
  other: "Garmin HRM 胸ストラップが基準。FIT ファイルから speed < 0.5 m/s で停止区間11か所（約26分の補給休憩）を除外。"
hrc_note_longrun:
  other: "Fitbit が自動検出。TCX は約2分間隔で心拍を書き出す（109分で55点）。最初の約90秒は時刻合わせのアーティファクト。ピーク差：5 bpm。"
hrc_note_intervalrun:
  other: "ピーク心拍は182 bpm で一致。約20分付近、回復後に新しいインターバルを始める際に約60秒の遅れ——Fitbit 光学式は立ち上がりが遅い。"
hrc_note_indoor:
  other: "HRM-Pro 胸ストラップ → greenTEG CORE センサー → Zwift FIT 書き出し。Fitbit は全区間をカバー、Garmin Fenix 8 時計光学式は約39分から開始。MAE は HRM 胸ストラップを基準に算出。"

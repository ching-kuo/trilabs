hrc_note_swim1:
  other: "水中兩個感測器都不是基準——皆為手腕光學。高強度主課表（15:25–32:40）：MAE 1.3 bpm。"
hrc_note_swim2:
  other: "課表：200m 熱身 → 3×500m @90% → 12×25m 最高划頻 → 200m 緩和。熱身段 MAE 17.5 bpm。主課表 MAE 1.6 bpm。峰值：180 vs 181 bpm。"
hrc_note_bike:
  other: "Garmin HRM 胸帶為基準。透過 FIT 檔以 speed < 0.5 m/s 移除 11 段靜止時段（約 26min 補給休息）。"
hrc_note_longrun:
  other: "Fitbit 自動偵測。TCX 以約 2min 間隔匯出心率（109min 共 55 點）。前約 90s 為對齊誤差。峰值差距：5 bpm。"
hrc_note_intervalrun:
  other: "峰值心率一致為 182 bpm。約 20min 處恢復後起跑進入下一組間歇時有約 60s 延遲——Fitbit 光學爬升較慢。"
hrc_note_indoor:
  other: "HRM-Pro 胸帶 → greenTEG CORE 感測器 → Zwift FIT 匯出。Fitbit 記錄全程；Garmin Fenix 8 手錶光學約 39min 後才開始。MAE 以 HRM 胸帶為基準。"

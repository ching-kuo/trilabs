<script defer src="https://stats.trilabs.dev/script.js" data-website-id="5fe57600-2067-40a9-bcc8-1168aa321f5a"></script>
<script>
  function getGiscusTheme(scheme) {
    return scheme === 'dark' ? 'catppuccin_frappe' : 'light';
  }

  function setGiscusTheme(theme) {
    const iframe = document.querySelector('iframe.giscus-frame');
    if (!iframe) return;

    iframe.contentWindow.postMessage(
      { giscus: { setConfig: { theme } } },
      'https://giscus.app'
    );
  }

  window.addEventListener('onColorSchemeChange', function (event) {
    setGiscusTheme(getGiscusTheme(event.detail));
  });
</script>
